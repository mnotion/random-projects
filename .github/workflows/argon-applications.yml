name: Build Argon Applications
on:
  push:
    paths:
      - 'minecraft-application-plugin/**'
      - '.github/workflows/argon-applications.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -f minecraft-application-plugin/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: argon-applications
          path: minecraft-application-plugin/target/*.jar
